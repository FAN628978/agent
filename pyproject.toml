[project]
name = "agent"
version = "0.1.0"
description = "Agent core engine"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pytest>=9.0.3",
    "python-dotenv>=1.0.0",
    "requests>=2.0.0",
]

[project.scripts]
agent = "src.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
